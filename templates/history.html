{% extends "base.html" %}

{% block title %}History - Media Ingest Pi{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Transfer History</h1>
    <p class="page-subtitle">View past transfer records</p>
</div>

<div class="card">
    <div class="card-header">
        <h2 class="card-title">Filters</h2>
    </div>
    
    <div class="flex gap-2">
        <select id="filter-status" class="form-select" onchange="loadHistory()">
            <option value="">All Status</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
            <option value="in_progress">In Progress</option>
        </select>
        
        <button class="btn btn-secondary" onclick="loadHistory()">Refresh</button>
    </div>
</div>

<div class="card">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Device</th>
                    <th>Status</th>
                    <th>Transferred</th>
                    <th>Failed</th>
                    <th>Deleted</th>
                    <th>Started</th>
                    <th>Duration</th>
                    <th>Drop Location</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="history-table-body">
                <tr>
                    <td colspan="9" class="text-center">
                        <div class="spinner"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <div class="flex flex-between flex-center mt-2">
        <div id="pagination-info">Showing 0 transfers</div>
        <div class="flex gap-1">
            <button class="btn btn-sm btn-secondary" id="prev-page" onclick="previousPage()" disabled>Previous</button>
            <button class="btn btn-sm btn-secondary" id="next-page" onclick="nextPage()">Next</button>
        </div>
    </div>
</div>

<script src="/static/js/history.js"></script>
{% endblock %}
